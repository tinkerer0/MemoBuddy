name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What small problem would this solve?
      description: Describe the interruption or repeated task, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the lightest interaction that would help.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Weight or complexity concerns
      description: Note any effect on startup, memory, privacy, or menu clutter.
