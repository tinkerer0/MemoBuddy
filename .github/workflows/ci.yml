name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to reviewed commits (tag in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build app (no installer)
        if: matrix.os != 'windows-latest'
        run: npm run tauri -- build --no-bundle
      # Windows: an unsigned test installer (src-tauri/tauri.windows.conf.json).
      # Store builds are packaged separately as MSIX (docs/RELEASE.md).
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run tauri -- build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'windows-latest'
        with:
          name: MemoBuddy-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # The Microsoft Store package, with the product identity Partner Center
      # assigned to the app (Product management > Product identity; the identity
      # name keeps the first reserved name, MemoPet).
      - name: Pack MSIX for the Microsoft Store
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >
          ./scripts/pack-msix.ps1 -SkipBuild
          -IdentityName "xixxxx.MemoBuddy"
          -Publisher "CN=EF58497A-4F82-4852-A744-16A73ADE4F6E"
          -PublisherDisplayName "xixxxx"
          -Version "$((Get-Content package.json | ConvertFrom-Json).version).0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'windows-latest'
        with:
          name: MemoBuddy-msix
          path: packaging/windows/out/*.msix
          if-no-files-found: error
