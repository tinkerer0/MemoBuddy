name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app (no installer)
        run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: memopet-windows-exe
          path: src-tauri/target/release/memopet.exe
