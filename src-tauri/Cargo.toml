[package]
name = "memopet"
version = "1.0.0"
description = "A tiny pet on your desktop that keeps your notes"
authors = ["tinkerer0"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memopet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.0"
sys-locale = "0.3.2"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

[target."cfg(windows)".dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[dev-dependencies]
tempfile = "3.27.0"

# Mac App Store: wry and tao without private macOS API use (see vendor/README.md).
[patch.crates-io]
wry = { path = "../vendor/wry" }
tao = { path = "../vendor/tao" }
